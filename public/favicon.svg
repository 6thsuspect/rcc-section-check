<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="RCC Section Check">
  <!--
    Application logo — the mark used in the app header: the bar/section lattice
    of the "bars" line icon on the drafting-ink tile. Keep this file, the PNG
    fallbacks generated by scripts/make-favicons.mjs and the header mark in
    src/App.tsx in step.
    Colours mirror the design tokens in src/index.css (--color-ink #17222c,
    --color-accent-wash #e8f0fa). Presentation attributes carry the light-tab
    appearance; the style block only inverts the tile on dark browser chrome.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e8f0fa; }
      .bars { stroke: #17222c; }
    }
  </style>
  <rect class="tile" x="0" y="0" width="32" height="32" rx="7.5" fill="#17222c" />
  <g class="bars" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.875 6.5v19" />
    <path d="M23.125 6.5v19" />
    <path d="M8.875 11.25h14.25" />
    <path d="M8.875 20.75h14.25" />
  </g>
</svg>
