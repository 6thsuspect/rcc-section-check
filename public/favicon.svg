<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" role="img" aria-label="RCC Section Check">
  <!--
    Application logo — the mark of the app title and the browser tab:
    a dark drafting tile carrying the concrete boundary, the closed stirrup with
    its two hooks, and the eight main bars of a beam section.
    Keep this file in step with src/components/Logo.tsx (the same artwork, used
    by the header mark and by the printed report) and with the geometry drawn by
    scripts/make-favicons.mjs (the PNG fallbacks); branding.test.tsx checks them.
    The supplied artwork was 500 × 600; the tile is squared here so it fills a
    square icon slot, the drawing inside is unchanged (translated 50 units), and
    the pattern path carries fill="none" — an open path is filled as if closed,
    which would wash a triangle over every grid cell.
  -->
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
    <!-- Shadow filter for the drawing -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Logo background -->
  <rect width="600" height="600" rx="40" fill="#0a0a0a" />
  <rect width="600" height="600" rx="40" fill="url(#grid)" />
  <rect width="600" height="600" rx="40" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Main drawing group -->
  <g filter="url(#shadow)" transform="translate(50 0)">
    <!-- RCC section boundary: slightly reduced depth -->
    <!-- Outer boundary -->
    <rect x="70" y="40" width="360" height="460" rx="40" fill="#f8fafc" />
    <!-- Inner boundary -->
    <rect x="90" y="60" width="320" height="420" rx="20" fill="#0a0a0a" />

    <!-- Stirrup: closed loop tangent to the main bars -->
    <rect x="107" y="77" width="286" height="386" rx="21" ry="21" fill="none" stroke="#475569" stroke-width="3" />

    <!-- Hooks at the ends of the stirrup -->
    <line x1="138" y1="77" x2="159.2" y2="98.2" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="107" y1="108" x2="128.2" y2="129.2" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Main reinforcement bars (cross-section) -->
    <g fill="#ffffff" stroke="#0a0a0a" stroke-width="2">
      <!-- Top face: 3 bars -->
      <circle cx="128" cy="98" r="18" />
      <circle cx="250" cy="98" r="18" />
      <circle cx="372" cy="98" r="18" />

      <!-- Left face: 1 bar at centre -->
      <circle cx="128" cy="270" r="18" />

      <!-- Right face: 1 bar at centre -->
      <circle cx="372" cy="270" r="18" />

      <!-- Bottom face: 3 bars -->
      <circle cx="128" cy="442" r="18" />
      <circle cx="250" cy="442" r="18" />
      <circle cx="372" cy="442" r="18" />
    </g>

    <!-- Inner rebar core details: reduced opacity -->
    <g fill="#475569" opacity="0.4">
      <circle cx="128" cy="98" r="6" />
      <circle cx="250" cy="98" r="6" />
      <circle cx="372" cy="98" r="6" />

      <circle cx="128" cy="270" r="6" />
      <circle cx="372" cy="270" r="6" />

      <circle cx="128" cy="442" r="6" />
      <circle cx="250" cy="442" r="6" />
      <circle cx="372" cy="442" r="6" />
    </g>
  </g>
</svg>
